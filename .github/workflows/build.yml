name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: sh mvnw -B -ntp clean verify
      - name: JavaFX smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a sh mvnw -B -ntp javafx:run '-Djavafx.args=--smoke-test'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
