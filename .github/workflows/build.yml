name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean build
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: sh gradlew --no-daemon clean build
      - name: JavaFX smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a sh gradlew --no-daemon smokeTest
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: build/test-results/test/
